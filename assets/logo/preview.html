<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AuraGen Logo</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  section{display:grid;place-items:center;min-height:50vh;padding:24px}
  .dark{background:#14161C}.light{background:#F5F5F3}
  img{width:min(100%,520px);height:auto}
</style></head>
<body>
  <section class="light"><img src="auragen-logo-light.svg" alt="AuraGen logo"></section>
  <section class="dark"><img src="auragen-logo-dark.svg" alt="AuraGen logo"></section>
  <section class="dark"><img src="auragen-logo-tile.svg" alt="AuraGen logo tile" style="width:min(100%,300px)"></section>
</body></html>
