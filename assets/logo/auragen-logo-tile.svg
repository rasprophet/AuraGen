<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img" aria-labelledby="t">
  <title id="t">AuraGen</title>
  <defs>
    <!-- AuraGen brand colors: A = "Aura" navy / white, G = "Gen" emerald -->
    <linearGradient id="gen-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FC995"/>
      <stop offset="1" stop-color="#0FA877"/>
    </linearGradient>

    <!-- Golden halo -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8860B"/>
      <stop offset="0.3" stop-color="#F5C542"/>
      <stop offset="0.5" stop-color="#FFE9A3"/>
      <stop offset="0.7" stop-color="#F5C542"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="11" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- Back half of the halo (behind the letters) / front half (over them) -->
    <clipPath id="back-half"><rect x="-20" y="-20" width="460" height="170"/></clipPath>
    <clipPath id="front-half"><rect x="-20" y="150" width="460" height="170"/></clipPath>

    <!-- Halo lightens slightly where it crosses the midlines -->
    <mask id="midline-lighten" maskUnits="userSpaceOnUse" x="-20" y="-20" width="460" height="340">
      <rect x="-20" y="-20" width="460" height="340" fill="#fff"/>
      <g fill="#000" fill-opacity="0.3" filter="url(#soft)">
        <rect x="118" y="144" width="54" height="32" rx="6"/>
        <rect x="296" y="144" width="80" height="32" rx="6"/>
      </g>
    </mask>

    <!-- One shared ellipse so back + front highlights stay in sync -->
    <ellipse id="ring" cx="217" cy="150" rx="190" ry="12" pathLength="100"/>
  </defs>

  <style>
    .aura { fill: #F4F6FA; }
    .base  { fill: none; stroke: url(#gold); stroke-width: 13; opacity: .8; }
    .glint { fill: none; stroke: #FFF6D6; stroke-width: 13; stroke-linecap: round;
             stroke-dasharray: 16 34; animation: spin 3s linear infinite; }
    @keyframes spin { to { stroke-dashoffset: -100; } }
    @media (prefers-reduced-motion: reduce) { .glint { animation: none; } }
  </style>

  <rect width="420" height="420" rx="72" fill="#0E1A22"/>
  <g transform="translate(-7 60)">
  <!-- Halo: back half -->
  <g clip-path="url(#back-half)" filter="url(#glow)" opacity="0.85">
    <use href="#ring" class="base"/>
    <use href="#ring" class="glint"/>
  </g>

  <!-- G (drawn first so the A sits on top where they join) -->
  <g fill="none" stroke="url(#gen-green)" stroke-width="38">
    <path d="M336.6 106 A70 70 0 1 0 353 151"/>
  </g>
  <rect x="288" y="149" width="84" height="22" fill="url(#gen-green)"/>

  <!-- A (bold, flat apex) -->
  <path class="aura" fill-rule="evenodd"
        d="M62 240 L126 62 H164 L228 240 H190 L165.2 171 H124.8 L100 240 Z
           M145 115 L157.3 149 H132.7 Z"/>

  <!-- Halo: front half (slightly lightened over the midlines) -->
  <g mask="url(#midline-lighten)">
    <g clip-path="url(#front-half)" filter="url(#glow)">
      <use href="#ring" class="base"/>
      <use href="#ring" class="glint"/>
    </g>
  </g>
  </g>
</svg>
