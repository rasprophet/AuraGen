3.5963517485152 159.43433870860255H309.6300422695541V156.95539528425186H372.2654864058775V159.43433870860255H368.5470712693515Q355.6565654627279 159.43433870860255 356.152354147598 170.58958411818065Z"/>
  <path class="aura" d="M141.41509285565655 62.0 219.8090157232405 238.51263394538958H183.1846843451687L129.73416134783844 101.70533850323889ZM88.1178092321167 221.90371300223995Q86.18186093479908 226.86159985094133 87.42133264697442 230.33212064503232Q88.66080435914976 233.80264143912328 91.61193324728913 235.6618490073863Q94.5630621354285 237.5210565756493 97.53779424464932 237.5210565756493H99.76884332656495V240.0H47.73451359412252V237.5210565756493Q47.73451359412252 237.5210565756493 48.850038135080325 237.5210565756493Q49.96556267603814 237.5210565756493 49.96556267603814 237.5210565756493Q55.66713255204473 237.5210565756493 61.74054394170392 233.92658861034081Q67.8139553313631 230.33212064503232 71.78026481032421 221.90371300223995ZM141.41509285565655 62.0 142.74304638634754 87.98218368215689 81.02328618582555 239.2563169726948H64.04240268686394L128.00507410092197 92.14893897707134Q128.5067938516023 91.24584342584672 130.1712445854034 87.44475649445586Q131.8356953192045 83.643669563065 133.89559078773965 78.67985164855341Q135.9554862562748 73.71603373404182 137.51959303993982 69.10045411210136Q139.08369982360486 64.4848744901609 139.18404377374094 62.0ZM170.44790208097314 178.04444967298215V187.48815894875565H95.86729140287864V178.04444967298215ZM176.58594998374772 221.90371300223995H212.3662543843782Q216.2853574211764 230.33212064503232 222.38237203191704 233.92658861034081Q228.47938664265772 237.5210565756493 234.1809565186643 237.5210565756493Q234.1809565186643 237.5210565756493 235.1725338884046 237.5210565756493Q236.16411125814486 237.5210565756493 236.16411125814486 237.5210565756493V240.0H164.93491588929948V237.5210565756493H167.1659649712151Q171.97630142761747 237.5210565756493 175.74488853921156 233.43079992547067Q179.51347565080562 229.34054327529202 176.58594998374772 221.90371300223995Z"/>

  <!-- Halo: front half (slightly lightened over the midlines) -->
  <g mask="url(#midline-lighten)">
    <g filter="url(#glow)"><g clip-path="url(#front-half)">
      <use href="#ring" class="base"/>
      <use href="#ring" class="glint"/>
    </g></g>
  </g>
  </g>
</svg>
