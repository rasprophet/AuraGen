  <path class="aura" d="M129.13265645970134 71.07087825525466 199.5366722454462 229.59334800926268H166.6450920034485L118.64224526216847 106.72944943662215ZM81.2674309382391 214.67720796303956Q79.528794453432 219.12978708131513 80.64193923300088 222.246592464108Q81.75508401256977 225.3633978469009 84.40543390228355 227.03311501625424Q87.05578379199733 228.70283218560758 89.72733126296266 228.70283218560758H91.73099186618666V230.92912174474534H45.0V228.70283218560758Q45.0 228.70283218560758 46.001830301612 228.70283218560758Q47.003660603224 228.70283218560758 47.003660603224 228.70283218560758Q52.12412658924089 228.70283218560758 57.57853600912844 225.4747123248578Q63.032945429016 222.246592464108 66.59500872363645 214.67720796303956ZM129.13265645970134 71.07087825525466 130.32526499257733 94.40495828587774 74.89598154174578 230.261234877004H59.645789356107116L117.0893865535609 98.14703796281907Q117.53997103708757 97.33598589247109 119.03478098472934 93.92230566661154Q120.52959093237112 90.50862544075198 122.37954189513512 86.05071975077732Q124.22949285789912 81.59281406080265 125.63418590883556 77.4476542234471Q127.038878959772 73.30249438609155 127.12899585647735 71.07087825525466ZM155.2064423379294 175.28807989248799V183.76928650400797H88.22708603807689V175.28807989248799ZM160.71890051878273 214.67720796303956H192.8524769963338Q196.3721451284511 222.246592464108 201.84775212959022 225.4747123248578Q207.32335913072933 228.70283218560758 212.4438251167462 228.70283218560758Q212.4438251167462 228.70283218560758 213.33434094040132 228.70283218560758Q214.22485676405643 228.70283218560758 214.22485676405643 228.70283218560758V230.92912174474534H150.25533959083515V228.70283218560758H152.25900019405918Q156.57906725312628 228.70283218560758 159.9635600401856 225.02945441303024Q163.34805282724494 221.3560766404529 160.71890051878273 214.67720796303956Z"/>

  <!-- Halo: front half (slightly lightened over the midlines) -->
  <g mask="url(#midline-lighten)">
    <g filter="url(#glow)"><g clip-path="url(#front-half)">
      <use href="#ring" class="base"/>
      <use href="#ring" class="glint"/>
    </g></g>
  </g>
  </g>
</svg>
