<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-labelledby="t">
  <title id="t">AuraGen</title>
  <defs>
    <!-- AuraGen brand colors (from the exchange wordmark): A = "Aura" navy / white, G = "Gen" emerald -->
    <linearGradient id="gen-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FC995"/>
      <stop offset="1" stop-color="#0FA877"/>
    </linearGradient>

    <!-- Golden halo -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8860B"/>
      <stop offset="0.3" stop-color="#F5C542"/>
      <stop offset="0.5" stop-color="#FFE9A3"/>
      <stop offset="0.7" stop-color="#F5C542"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- Back half of the halo (behind the letters) / front half (over them) -->
    <clipPath id="back-half"><rect x="0" y="0" width="420" height="147"/></clipPath>
    <clipPath id="front-half"><rect x="0" y="147" width="420" height="153"/></clipPath>

    <!-- Halo is lightened where it passes over the midlines so they show through -->
    <mask id="midline-lighten" maskUnits="userSpaceOnUse" x="0" y="0" width="420" height="300">
      <rect width="420" height="300" fill="#fff"/>
      <g fill="#000" fill-opacity="0.6" filter="url(#soft)">
        <rect x="100" y="140" width="50" height="30" rx="6"/>
        <rect x="298" y="140" width="66" height="30" rx="6"/>
      </g>
    </mask>

    <!-- One shared ellipse so back + front highlights stay in sync -->
    <ellipse id="ring" cx="210" cy="147" rx="182" ry="12" pathLength="100"/>
  </defs>

  <style>
    .aura { fill: #0E1A36; }
    .base  { fill: none; stroke: url(#gold); stroke-width: 6; opacity: .75; }
    .glint { fill: none; stroke: #FFF6D6; stroke-width: 6; stroke-linecap: round;
             stroke-dasharray: 16 34; animation: spin 3s linear infinite; }
    @keyframes spin { to { stroke-dashoffset: -100; } }
    @media (prefers-reduced-motion: reduce) { .glint { animation: none; } }
  </style>

  <!-- Halo: back half -->
  <g clip-path="url(#back-half)" filter="url(#glow)" opacity="0.85">
    <use href="#ring" class="base"/>
    <use href="#ring" class="glint"/>
  </g>

  <!-- AG letters -->
  <g class="aura">
    <!-- A -->
    <path d="M58 240 L110 62 H140 L192 240 H163 L125 105 L87 240 Z"/>
    <rect x="96" y="146" width="58" height="18"/>
  </g>
  <!-- G -->
  <path d="M339.4 95.6 A75 75 0 1 0 362 155 H300" fill="none" stroke="url(#gen-green)" stroke-width="28"
        transform="translate(-6 0)"/>

  <!-- Halo: front half (lightened over the midlines) -->
  <g mask="url(#midline-lighten)">
    <g clip-path="url(#front-half)" filter="url(#glow)">
      <use href="#ring" class="base"/>
      <use href="#ring" class="glint"/>
    </g>
  </g>
</svg>
